name: build-and-deploy

on:
  push:
    branches: [cinema]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push monolith
        uses: docker/build-push-action@v6
        with:
          context: ./src/monolith
          file: ./src/monolith/Dockerfile
          push: true
          tags: |
            ghcr.io/sirdorblu/monolith:latest
            ghcr.io/sirdorblu/monolith:${{ github.sha }}

      - name: Build & Push movies-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/movies
          file: ./src/microservices/movies/Dockerfile
          push: true
          tags: |
            ghcr.io/sirdorblu/movies-service:latest
            ghcr.io/sirdorblu/movies-service:${{ github.sha }}

      - name: Build & Push events-service
        if: hashFiles('src/microservices/events/**') != ''
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/events
          file: ./src/microservices/events/Dockerfile
          push: true
          tags: |
            ghcr.io/sirdorblu/events-service:latest
            ghcr.io/sirdorblu/events-service:${{ github.sha }}

      - name: Build & Push proxy-service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/proxy
          file: ./src/microservices/proxy/Dockerfile
          push: true
          tags: |
            ghcr.io/sirdorblu/proxy-service:latest
            ghcr.io/sirdorblu/proxy-service:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Ensure namespace
        run: kubectl get ns cinemaabyss >/dev/null 2>&1 || kubectl create ns cinemaabyss

      - name: Ensure GHCR imagePull secret (idempotent)
        run: |
          kubectl -n cinemaabyss create secret docker-registry ghcr-creds \
            --docker-server=ghcr.io \
            --docker-username="${{ secrets.GHCR_USERNAME }}" \
            --docker-password="${{ secrets.GHCR_TOKEN }}" \
            --docker-email="batersit@inbox.ru" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: kubectl -n cinemaabyss apply -R -f src/kubernetes/

      - name: Roll images to the new SHA
        env:
          SHA: ${{ github.sha }}
        run: |
          kubectl -n cinemaabyss get deploy
          kubectl -n cinemaabyss set image deployment/monolith        monolith=ghcr.io/sirdorblu/monolith:${SHA}
          kubectl -n cinemaabyss set image deployment/movies-service  movies-service=ghcr.io/sirdorblu/movies-service:${SHA}
          kubectl -n cinemaabyss set image deployment/events-service  events-service=ghcr.io/sirdorblu/events-service:${SHA}
          kubectl -n cinemaabyss set image deployment/proxy-service   proxy-service=ghcr.io/sirdorblu/proxy-service:${SHA}
          kubectl -n cinemaabyss rollout status deployment/monolith
          kubectl -n cinemaabyss rollout status deployment/movies-service
          kubectl -n cinemaabyss rollout status deployment/events-service
          kubectl -n cinemaabyss rollout status deployment/proxy-service

