{{- if .Values.eventsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels: { app: events-service }
spec:
  replicas: {{ .Values.eventsService.replicas }}
  selector: { matchLabels: { app: events-service } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: events-service } }
    spec:
      containers:
      - name: events-service
        image: {{ .Values.eventsService.image.repository }}:{{ .Values.eventsService.image.tag }}
        imagePullPolicy: {{ .Values.eventsService.image.pullPolicy }}
        ports: [{ containerPort: {{ .Values.eventsService.service.targetPort }} }]
        env:
        - { name: PORT, value: "{{ .Values.eventsService.service.targetPort }}" }
        - { name: KAFKA_BROKERS, value: "kafka:9092" }
        readinessProbe:
          httpGet: { path: /api/events/health, port: {{ .Values.eventsService.service.targetPort }} }
          initialDelaySeconds: 5
          periodSeconds: 10
      {{- if .Values.imagePullSecretName }}
      imagePullSecrets: [ { name: {{ .Values.imagePullSecretName | quote }} } ]
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
spec:
  selector: { app: events-service }
  type: {{ .Values.eventsService.service.type }}
  ports:
  - name: http
    port: {{ .Values.eventsService.service.port }}
    targetPort: {{ .Values.eventsService.service.targetPort }}
{{- end }}

