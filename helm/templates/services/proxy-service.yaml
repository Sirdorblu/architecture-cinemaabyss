{{- if .Values.proxyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: {{ .Values.global.namespace }}
  labels: { app: proxy-service }
spec:
  replicas: {{ .Values.proxyService.replicas }}
  selector: { matchLabels: { app: proxy-service } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: proxy-service } }
    spec:
      containers:
      - name: proxy-service
        image: {{ .Values.proxyService.image.repository }}:{{ .Values.proxyService.image.tag }}
        imagePullPolicy: {{ .Values.proxyService.image.pullPolicy }}
        ports: [{ containerPort: {{ .Values.proxyService.service.targetPort }} }]
        env:
        - { name: PORT, value: "{{ .Values.proxyService.service.targetPort }}" }
        - { name: MONOLITH_URL, value: "http://monolith:{{ .Values.monolith.service.port }}" }
        - { name: MOVIES_SERVICE_URL, value: "http://movies-service:{{ .Values.moviesService.service.port }}" }
        - { name: EVENTS_SERVICE_URL, value: "http://events-service:{{ .Values.eventsService.service.port }}" }
        readinessProbe:
          httpGet: { path: /health, port: {{ .Values.proxyService.service.targetPort }} }
          initialDelaySeconds: 5
          periodSeconds: 10
      {{- if .Values.imagePullSecretName }}
      imagePullSecrets: [ { name: {{ .Values.imagePullSecretName | quote }} } ]
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: {{ .Values.global.namespace }}
spec:
  selector: { app: proxy-service }
  type: {{ .Values.proxyService.service.type }}
  ports:
  - name: http
    port: {{ .Values.proxyService.service.port }}
    targetPort: {{ .Values.proxyService.service.targetPort }}
{{- end }}

